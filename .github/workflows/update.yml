name: Japanese Metadata Library

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "crawler.py"
      - "config.py"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"
      - "docs/index.html"
      - "docs/app.js"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: japanese-metadata-library-v2
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PURGE_EHENTAI_NON_H: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[purge-ehentai-non-h]') }}
      PURGE_R18G: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[purge-r18g]') }}
      OFFLINE_FILTER_PURGE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[purge-ehentai-non-h]') || contains(github.event.head_commit.message, '[purge-r18g]')) }}
    outputs:
      pages_artifact: ${{ steps.pages_artifact.outputs.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        if: env.OFFLINE_FILTER_PURGE != 'true'
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify content filters
        run: python -m unittest discover -s tests -v

      - name: Verify frontend syntax
        if: env.OFFLINE_FILTER_PURGE != 'true'
        run: node --check docs/app.js

      - name: Install Hitomi thumbnail resolver
        if: env.OFFLINE_FILTER_PURGE != 'true'
        run: npm install --no-save node-hitomi@9.2.0

      - name: Start local Jandapress for metadata sources
        if: env.OFFLINE_FILTER_PURGE != 'true'
        continue-on-error: true
        run: |
          docker pull ghcr.io/sinkaroid/jandapress:latest
          docker rm -f jandapress 2>/dev/null || true
          docker run -d --name jandapress -p 3000:3000 \
            -e USER_AGENT="Japanese-Metadata-Library/1.7 GitHub-Actions" \
            ghcr.io/sinkaroid/jandapress:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "Jandapress is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Jandapress did not become ready"
          docker logs --tail 80 jandapress || true
          exit 0

      - name: Update metadata
        env:
          JANDAPRESS_URL: "http://127.0.0.1:3000"
          HENTAI3_SEARCH_KEY: "language:japanese"
          ASMHENTAI_SEARCH_KEY: "日本語"
          ASMHENTAI_SEARCH_KEYS: "日本語"
          ASMHENTAI_PROBE_KEY: "futanari"
          RUN_FILTER_AUDIT_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[filter-audit]') }}
        run: |
          if [ "$PURGE_R18G" = "true" ]; then
            python -u tools/purge_r18g.py --dry-run
            python -u tools/purge_r18g.py
          elif [ "$PURGE_EHENTAI_NON_H" = "true" ]; then
            python -u tools/purge_ehentai_non_h.py --dry-run
            python -u tools/purge_ehentai_non_h.py
          elif [ "$RUN_FILTER_AUDIT_ONLY" = "true" ]; then
            HITOMI_FILTER_AUDIT_LIMIT=500 python -u crawler.py --audit-filters-only
          else
            python -u crawler.py
          fi

      - name: Cache 3Hentai thumbnails locally
        if: env.OFFLINE_FILTER_PURGE != 'true'
        env:
          HENTAI3_THUMB_LIMIT: "12"
          HENTAI3_THUMB_DELAY_SEC: "2.0"
        run: python tools/cache_3hentai_thumbs.py

      - name: Cache ASMHentai thumbnails locally
        if: env.OFFLINE_FILTER_PURGE != 'true'
        env:
          ASMHENTAI_THUMB_LIMIT: "80"
          ASMHENTAI_THUMB_DELAY_SEC: "0.4"
        run: python tools/cache_asmhentai_thumbs.py

      - name: Cache Hitomi thumbnails locally
        if: env.OFFLINE_FILTER_PURGE != 'true'
        env:
          HITOMI_THUMB_LIMIT: "110"
          HITOMI_THUMB_DELAY_MS: "120"
        run: node tools/cache_hitomi_thumbs.mjs

      - name: Build lightweight Pages catalog
        run: python tools/build_public_catalog.py

      - name: Verify Pages bundle
        run: python tools/verify_pages_bundle.py

      - name: Show Jandapress diagnostics
        if: always() && env.OFFLINE_FILTER_PURGE != 'true'
        run: |
          echo "--- Jandapress logs ---"
          docker logs --tail 100 jandapress 2>/dev/null || true

      - name: Commit site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state/filter_audit.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update metadata library"
            git pull --rebase origin main
            git push
          fi

      - name: Select Pages artifact for this attempt
        id: pages_artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: docs

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.update.outputs.pages_artifact }}
