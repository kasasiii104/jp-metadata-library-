name: Japanese Metadata Library

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: japanese-metadata-library
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Hitomi thumbnail resolver
        run: npm install --no-save node-hitomi@9.2.0

      - name: Start local Jandapress for 3Hentai
        continue-on-error: true
        run: |
          docker pull ghcr.io/sinkaroid/jandapress:latest
          docker rm -f jandapress 2>/dev/null || true
          docker run -d --name jandapress -p 3000:3000 \
            -e USER_AGENT="Japanese-Metadata-Library/1.7 GitHub-Actions" \
            ghcr.io/sinkaroid/jandapress:latest

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "Jandapress is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Jandapress did not become ready"
          docker logs --tail 80 jandapress || true
          exit 0

      - name: Update metadata
        env:
          JANDAPRESS_URL: "http://127.0.0.1:3000"
          HENTAI3_SEARCH_KEY: "language:japanese"
        run: python crawler.py

      - name: Cache 3Hentai thumbnails locally
        env:
          JANDAPRESS_URL: "http://127.0.0.1:3000"
          HENTAI3_THUMB_LIMIT: "80"
        run: python tools/cache_3hentai_thumbs.py

      - name: Cache Hitomi thumbnails locally
        env:
          HITOMI_THUMB_LIMIT: "110"
          HITOMI_THUMB_DELAY_MS: "120"
        run: node tools/cache_hitomi_thumbs.mjs

      - name: Show Jandapress diagnostics
        if: always()
        run: |
          echo "--- Jandapress logs ---"
          docker logs --tail 100 jandapress 2>/dev/null || true

      - name: Commit site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update metadata library"
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
