name: Japanese Metadata Library

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: japanese-metadata-library
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Hitomi thumbnail resolver
        run: npm install --no-save node-hitomi@9.2.0

      - name: Update metadata
        run: python crawler.py

      - name: Cache Hitomi thumbnails locally
        env:
          HITOMI_THUMB_LIMIT: "110"
          HITOMI_THUMB_DELAY_MS: "120"
        run: node tools/cache_hitomi_thumbs.mjs

      - name: Commit site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update metadata library"
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
