name: Content filter regression tests
on:
  pull_request:
    paths: ["crawler.py", "config.py", "sources/**", "tests/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["crawler.py", "config.py", "sources/**", "tests/**", ".github/workflows/test.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sources
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
